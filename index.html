<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理大廁所圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f1f0; --surface:#ffffff; --fg:#211c1c; --muted:#6d6464; --line:#ddd7d6;
  --brick:#9c2f2a; --brick-soft:#f1dedb; --on-brick:#ffffff; --ok:#2f6b4a; --warn:#96650f; --me:#2f7fe0;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sans:"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191616; --surface:#242020; --fg:#efe9e8; --muted:#a59b9a; --line:#3a3433;
    --brick:#e07a70; --brick-soft:#40221f; --on-brick:#1a0f0e; --ok:#7cc79b; --warn:#e0b25a; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:1.1rem;margin:0;flex:1;white-space:nowrap}
select,input[type=text],input[type=email],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--brick);color:var(--on-brick);border-color:var(--brick);font-weight:600}
.btn.danger{color:var(--brick);border-color:var(--brick)}
.mapwrap{position:relative;flex:1 1 55%;min-height:40%}
#map{position:absolute;inset:0;background:#f2f2f0}
.outside{filter:grayscale(1) contrast(.6) brightness(1.18);opacity:.75}
#legend{position:absolute;left:10px;top:10px;z-index:500;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px;
  font-size:.75rem;color:#3a3433;display:flex;align-items:center;gap:6px}
#legend i{width:12px;height:12px;border-radius:50%;background:#1f8a5b;border:2px solid #fff;box-shadow:0 0 0 1px #1f8a5b}
#locate{position:absolute;right:10px;bottom:22px;z-index:500;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;color:var(--me)}
#geo{position:absolute;left:10px;bottom:22px;z-index:500;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:.75rem;color:var(--muted);max-width:calc(100% - 80px)}
.mk{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:2px solid #fff;
  background:#b5654a;color:#fff;font:700 12px var(--mono);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mk.has{background:#1f8a5b;color:#fff;border-color:#fff}
.mk.sel{outline:3px solid #211c1c;outline-offset:1px}
.medot{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff}
.panel{flex:0 1 45%;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.place{background:var(--brick);color:var(--on-brick);border-color:var(--brick)}
.list{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.loc{font-family:var(--mono);font-weight:700;font-size:1.1rem;white-space:nowrap}
.loc small{display:block;font-family:var(--sans);font-weight:400;font-size:.72rem;color:var(--me)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.where,.note{overflow-wrap:anywhere}
.note{font-size:.88rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.stars{color:var(--brick);letter-spacing:.1em;font-size:.9rem}
.edit{border:0;background:none;color:var(--brick);cursor:pointer;padding:4px;font-size:.85rem}
.side{display:flex;flex-direction:column;align-items:flex-end}
#adminBox{border:1px solid var(--brick);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
#adminBox h2{margin:0;font-size:.95rem}
.pend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:.88rem}
.pend .what{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.pend button{font-size:.8rem;padding:4px 10px}
dialog.sheet{margin:auto auto 0;width:min(560px,100%);max-width:100%;max-height:85dvh;border-radius:16px 16px 0 0;border-bottom:0;overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:8px;padding:14px 8px 10px 16px;border-bottom:1px solid var(--line)}
.chead h2{margin:0;font-size:1.05rem;flex:1}
.chead small{font-weight:400;color:var(--muted);margin-left:6px}
.chead .edit{font-size:1.1rem;color:var(--muted);padding:4px 10px}
.clist{list-style:none;margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:140px;overflow-y:auto}
.clist li{display:grid;grid-template-columns:32px 1fr auto;gap:0 10px;align-items:start}
.clist li.note{display:block;text-align:center;padding:28px 0}
.av{width:32px;height:32px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;
  background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 45% 32%)}
@media (prefers-color-scheme: dark){ .av{background:hsl(var(--h) 28% 26%);color:hsl(var(--h) 55% 82%)} }
.cm{min-width:0;overflow-wrap:anywhere}
.cm .who{font-weight:600;font-size:.85rem}
.cm time{font-size:.75rem;color:var(--muted);margin-left:8px}
.cm p{margin:2px 0 0;white-space:pre-wrap}
.cform{gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.cform input,.cform textarea{background:var(--bg)}
.av.emoji{font-size:1.15rem}
.av.boss{background:#fff1b8;color:#7a5200;box-shadow:0 0 0 2px #d4a017}
.badge{font-size:.68rem;font-weight:600;background:#d4a017;color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
#cMe{border:0;background:none;padding:0 0 4px;cursor:pointer}
#cAs{font-size:.78rem;align-self:flex-start;padding:0}
form>.field{flex:none}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emo button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1.2rem;cursor:pointer;padding:0}
.emo button[aria-pressed="true"]{border-color:var(--brick);box-shadow:0 0 0 2px var(--brick)}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;resize:none}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px 14px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--muted)}
.foot button{font-size:.75rem;padding:4px 10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:0;
  width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{display:flex;flex-direction:column;gap:12px;padding:16px}
form h2{margin:0;font-size:1.1rem}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0;font-size:.85rem;color:var(--muted)}
.field select,.field input,.field textarea{color:var(--fg);font-size:1rem;width:100%}
.check{display:flex;align-items:center;gap:8px}
.check input{width:20px;height:20px;accent-color:var(--brick)}
.sep{border-top:1px solid var(--line);padding-top:10px;font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .danger{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2000;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header>
  <h1>理大廁所圖</h1>
  <select id="floor" aria-label="我在幾樓"></select>
  <button class="btn primary" id="addBtn" type="button">＋ 新增</button>
</header>

<div class="mapwrap">
  <div id="map"></div>
  <div id="legend"><i></i>這層有廁所</div>
  <div id="geo">正在取得位置…</div>
  <button id="locate" type="button" aria-label="回到我的位置" title="回到我的位置">◎</button>
</div>

<div class="panel">
  <div id="adminBox" hidden></div>
  <div class="chips" id="chips"></div>
  <ul class="list" id="list"></ul>
  <div class="foot">
    <span id="count"></span>
    <button class="btn" id="exportBtn" type="button">匯出備份</button>
    <button class="btn" id="importBtn" type="button">匯入備份</button>
    <button class="btn" id="shareBtn" type="button">匯出給同學</button>
    <button class="btn" id="adminBtn" type="button" hidden>管理員</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<dialog id="dlg">
  <form id="form">
    <h2 id="formTitle">新增廁所</h2>
    <fieldset>
      <div class="row">
        <label class="field">位置<select id="fPlace" required></select></label>
        <label class="field">樓層<select id="fFloor" required></select></label>
      </div>
      <label class="field">位置描述（可不填）<input type="text" id="fWhere" maxlength="80" placeholder="例如：近升降機大堂"></label>
      <div class="row">
        <label class="field">類型<select id="fGender">
          <option value="both">男女皆有</option><option value="m">只有男廁</option>
          <option value="f">只有女廁</option><option value="all">性別友善</option></select></label>
        <label class="field">廁紙<select id="fPaper">
          <option value="unknown">未知</option><option value="yes">通常有</option>
          <option value="sometimes">不一定</option><option value="no">通常沒有</option></select></label>
        <label class="field">人流<select id="fCrowd">
          <option value="unknown">未知</option><option value="low">人少</option>
          <option value="mid">普通</option><option value="high">人多</option></select></label>
      </div>
      <label class="check"><input type="checkbox" id="fAccessible">有無障礙廁所</label>
    </fieldset>
    <div class="sep">你的評分和筆記（匯出給別人時可以不包含）</div>
    <fieldset>
      <label class="field">評分<select id="fRating">
        <option value="0">未評分</option><option value="5">★★★★★ 首選</option><option value="4">★★★★ 不錯</option>
        <option value="3">★★★ 可以</option><option value="2">★★ 勉強</option><option value="1">★ 避開</option></select></label>
      <label class="field">筆記<textarea id="fNote" rows="2" maxlength="300" placeholder="例如：午飯後要排隊"></textarea></label>
    </fieldset>
    <label class="check" id="againWrap"><input type="checkbox" id="fAgain">儲存後繼續加同一位置的另一層</label>
    <div class="actions">
      <button class="btn danger" id="delBtn" type="button" hidden>刪除</button>
      <button class="btn" id="cancelBtn" type="button">取消</button>
      <button class="btn primary" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="cdlg" class="sheet">
  <div class="chead"><h2 id="cTitle">評論</h2><button class="edit" id="cClose" type="button" aria-label="關閉">✕</button></div>
  <ul class="clist" id="cList"></ul>
  <form id="cForm" class="cform">
    <div class="crow">
      <button type="button" id="cMe" aria-label="設定暱稱和頭像"></button>
      <textarea id="cBody" rows="1" maxlength="300" required placeholder="寫下評論，所有人都看得到" aria-label="評論"></textarea>
      <button class="btn primary" type="submit">送出</button>
    </div>
    <button type="button" class="edit" id="cAs"></button>
  </form>
</dialog>

<dialog id="pdlg">
  <form id="pForm">
    <h2>你的暱稱和頭像</h2>
    <label class="field">暱稱<input type="text" id="pName" maxlength="20" required placeholder="留言時大家會看到這個名字"></label>
    <div class="field">頭像（可以不選）<div class="emo" id="pEmo"></div></div>
    <div class="actions">
      <button class="btn" id="pClose" type="button">取消</button>
      <button class="btn primary" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="ldlg">
  <form id="lForm">
    <h2>管理員登入</h2>
    <label class="field">電郵<input type="email" id="lEmail" required autocomplete="username"></label>
    <label class="field">密碼<input type="password" id="lPass" required autocomplete="current-password"></label>
    <div class="actions">
      <button class="btn" id="lClose" type="button">取消</button>
      <button class="btn primary" type="submit">登入</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="campus.js"></script>
<script>
(function(){
  // Cores are the round stair-and-lift towers where the toilets sit; buildings are the stand-alone blocks.
  // Coordinates are OpenStreetMap building centres.
  var PLACES=[
    {id:"A",t:"core",ll:[22.30298,114.17828]},{id:"B",t:"core",ll:[22.30268,114.17847]},{id:"C",t:"core",ll:[22.30274,114.17894]},
    {id:"D",t:"core",ll:[22.30261,114.17944]},{id:"E",t:"core",ll:[22.30307,114.17958]},{id:"F",t:"core",ll:[22.30320,114.17908]},
    {id:"G",t:"core",ll:[22.30333,114.17857]},{id:"H",t:"core",ll:[22.30381,114.17871]},{id:"J",t:"core",ll:[22.30367,114.17921]},
    {id:"P",t:"core",ll:[22.30396,114.18051]},{id:"Q",t:"core",ll:[22.30443,114.18065]},{id:"S",t:"core",ll:[22.30503,114.18028]},
    {id:"T",t:"core",ll:[22.30490,114.18079]},{id:"U",t:"core",ll:[22.30537,114.18093]},
    {id:"R",t:"bld",ll:[22.30452,114.18004]},{id:"L",t:"bld",ll:[22.30341,114.17997]},{id:"M",t:"bld",ll:[22.30403,114.17971]},
    {id:"N",t:"bld",ll:[22.30426,114.18024]},{id:"V",t:"bld",ll:[22.30523,114.17944]},
    {id:"VA",t:"bld",ll:[22.30454,114.17918]},{id:"VS",t:"bld",ll:[22.30424,114.17866]},{id:"W",t:"bld",ll:[22.30556,114.18071]},
    {id:"X",t:"bld",ll:[22.30555,114.18003]},{id:"Y",t:"bld",ll:[22.30587,114.18079]},{id:"Z",t:"bld",ll:[22.30667,114.17940]}
  ];
  var BY={}; PLACES.forEach(function(p){BY[p.id]=p;});
  var ORDER=PLACES.map(function(p){return p.id;});
  var FLOORS=["B","G","P"]; for (var i=1;i<=20;i++) FLOORS.push(String(i));
  function floorGap(a,b){ return Math.abs(FLOORS.indexOf(a)-FLOORS.indexOf(b)); }
  function metres(a,b){
    var R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLng=(b[1]-a[1])*r*Math.cos(a[0]*r);
    return Math.sqrt(dLat*dLat+dLng*dLng)*R;
  }

  var toilets={}, shared={}, notes={}, pos=null, myFloor="", filt={place:"",acc:false,paper:false,quiet:false,m:false,f:false};
  var editing=null, armed=false;
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function ls(k,v){ try{ if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null;} localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return null; } }
  var toastT; function toast(m){ var t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3500); }
  function persist(){ if(!ls("wc.toilets",toilets)||!ls("wc.notes",notes)) toast("這個瀏覽器不讓網頁存資料，關掉頁面後記錄會消失。"); }

  // ---- Cloud (Supabase). Without a config the site keeps everything on the device.
  // In cloud mode "shared" holds the approved records everyone sees and "toilets" holds this device's records that are not public yet.
  var SB=window.WC_CONFIG||{}, cloud=!!(SB.url&&SB.key), auth=null, admin=false, pending=[], ccount={}, status={}, statusKnown=false;
  function secretKey(k){
    if (/^sb_secret_/.test(k)) return true;
    try{ return /service_role/.test(atob(k.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))); }catch(e){ return false; }
  }
  if (cloud&&secretKey(SB.key)){ cloud=false; setTimeout(function(){ toast("設定裡放了不能公開的金鑰，雲端功能已停用。"); },0); }
  function setAuth(d){
    auth=d?{access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000}:null;
    ls("wc.auth",auth); if (!auth) admin=false;
  }
  function tokenReq(grant,body){
    return fetch(SB.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){ return r.ok?r.json():null; });
  }
  function fresh(){
    if (!auth||auth.exp-Date.now()>60000) return Promise.resolve();
    return tokenReq("refresh_token",{refresh_token:auth.refresh}).then(function(d){ setAuth(d&&d.access_token?d:null); },function(){});
  }
  function api(path,o){
    o=o||{};
    return fresh().then(function(){
      var h={apikey:SB.key,"Content-Type":"application/json"};
      if (auth) h.Authorization="Bearer "+auth.access; else if (/^eyJ/.test(SB.key)) h.Authorization="Bearer "+SB.key;
      if (o.prefer) h.Prefer=o.prefer;
      return fetch(SB.url+"/rest/v1/"+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined});
    }).then(function(r){
      return r.text().then(function(t){ if(!r.ok) throw new Error(t||String(r.status)); return t?JSON.parse(t):null; });
    });
  }
  function byId(id){ return "toilets?id=eq."+encodeURIComponent(id); }
  function newId(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function fromRow(r){ return {id:r.id,place:r.place,floor:r.floor,where:r.descr||"",gender:r.gender,paper:r.paper,crowd:r.crowd,accessible:!!r.accessible,updatedAt:r.updated_at}; }
  function toRow(t,st,target){
    return {id:t.id,place:t.place,floor:t.floor,descr:t.where||"",gender:t.gender||"both",paper:t.paper||"unknown",crowd:t.crowd||"unknown",
      accessible:!!t.accessible,status:st,target:target||null};
  }
  function upsert(rows){ return api("toilets?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:rows}); }
  function unpublished(){ return Object.keys(toilets).filter(function(id){ return status[id]!=="pending"; }); }
  function loadCloud(){
    return api("toilets?status=eq.approved&select=*").then(function(rows){
      shared={}; rows.forEach(function(r){ if(BY[r.place]&&FLOORS.indexOf(r.floor)>=0) shared[r.id]=fromRow(r); });
      var drop=Object.keys(toilets).filter(function(id){ return shared[id]; });
      drop.forEach(function(id){ delete toilets[id]; }); if (drop.length) persist();
      render();
      var mine=Object.keys(toilets);
      return Promise.all([
        api("comments?select=toilet_id").then(function(cs){ ccount={}; cs.forEach(function(c){ ccount[c.toilet_id]=(ccount[c.toilet_id]||0)+1; }); }),

      setAuth(d);
      return api("rpc/is_admin",{method:"POST",body:{}}).then(function(a){
        if (a!==true){ setAuth(null); toast("這個帳號不是管理員。"); return; }
        admin=true; $("ldlg").close(); return loadCloud();
      });
    }).catch(function(){ toast("連不上伺服器。"); });
  });
  $("lClose").onclick=function(){ $("ldlg").close(); };
  $("adminBtn").onclick=function(){
    if (!admin){ $("ldlg").showModal(); return; }
    fetch(SB.url+"/auth/v1/logout",{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+auth.access}}).catch(function(){});
    setAuth(null); pending=[]; loadCloud();
  };
  $("addBtn").onclick=function(){openForm(null);};
  $("cancelBtn").onclick=function(){$("dlg").close();};
  $("chips").addEventListener("click",function(e){
    if (e.target.closest("[data-clear]")){ filt.place=""; render(); return; }
    var c=e.target.closest("[data-chip]"); if(!c) return;
    filt[c.dataset.chip]=!filt[c.dataset.chip]; render();
  });
  $("list").addEventListener("click",function(e){ var b=e.target.closest("[data-edit]"), c=e.target.closest("[data-c]"); if(b) openForm(b.dataset.edit); else if(c) openComments(c.dataset.c); });
  $("floor").onchange=function(){ myFloor=$("floor").value; ls("wc.floor",myFloor); render(); };

  // ---- Backup
  function download(name,obj){
    var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }
  $("exportBtn").onclick=function(){
    download("polyu-toilets-"+new Date().toISOString().slice(0,10)+".json",{version:1,exportedAt:new Date().toISOString(),toilets:toilets,notes:notes});
  };
  // The shared file leaves out ratings and notes on purpose.
  $("shareBtn").onclick=function(){
    var out={}; all().forEach(function(t){ out[t.id]=t; });
    download("data.json",{version:1,exportedAt:new Date().toISOString(),toilets:out});
    toast("已下載 data.json，不含你的評分和筆記。");
  };
  $("importBtn").onclick=function(){ $("importFile").click(); };
  $("importFile").onchange=function(){
    var f=this.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result), n=0; if(!d||typeof d.toilets!=="object") throw 0;
        Object.keys(d.toilets).forEach(function(id){ var t=d.toilets[id]; if(t&&BY[t.place]&&FLOORS.indexOf(t.floor)>=0){ t.id=id; toilets[id]=t; n++; } });
        Object.keys(d.notes||{}).forEach(function(id){ if(toilets[id]) notes[id]=d.notes[id]; });
        persist(); render(); toast("已匯入 "+n+" 筆，相同的記錄已更新。");
      }catch(e){ toast("這個檔案不是廁所圖的備份。"); }
    };
    rd.readAsText(f); this.value="";
  };

  // ---- Boot
  function opts(sel,list,label,first){ sel.innerHTML=(first?'<option value="">'+first+'</option>':'')+list.map(function(v){return '<option value="'+v+'">'+label(v)+'</option>';}).join(""); }
  opts($("floor"),FLOORS,function(v){return "我在 "+v+"/F";},"我在幾樓？");
  opts($("fFloor"),FLOORS,function(v){return v+"/F";});
  opts($("fPlace"),ORDER,function(v){return v+(BY[v].t==="core"?" 圓柱":" 座");});
  toilets=ls("wc.toilets")||{}; notes=ls("wc.notes")||{};
  var sf=ls("wc.floor"); if (sf&&FLOORS.indexOf(sf)>=0){ myFloor=sf; $("floor").value=sf; }
  render(); startGeo();
  if (cloud){
    auth=ls("wc.auth"); $("shareBtn").hidden=true; $("adminBtn").hidden=false;
    (auth?api("rpc/is_admin",{method:"POST",body:{}}).then(function(a){ admin=a===true; },function(){}):Promise.resolve()).then(loadCloud);
  } else fetch("data.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if (!d||typeof d.toilets!=="object") return;
    Object.keys(d.toilets).forEach(function(id){ var t=d.toilets[id]; if(t&&BY[t.place]&&FLOORS.indexOf(t.floor)>=0){ t.id=id; shared[id]=t; } });
    render();
  }).catch(function(){});
})();
</script>
</body>
</html>
